name: ChessEnginePro
options:
  bundleIdPrefix: com.chessenginepro
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_EMIT_LOC_STRINGS: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_NS_ASSERTIONS: NO

targets:
  ChessEnginePro:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChessEnginePro
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chessenginepro.app
        PRODUCT_NAME: ChessEnginePro
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: ChessEnginePro/Core/Engine/Bridge/ChessEnginePro-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/ChessEnginePro/Core/Engine/Bridge
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/Build/Stockfish/$(PLATFORM_NAME)
        OTHER_LDFLAGS:
          - -lstockfish
          - -lsqlite3
          - -lc++
        CLANG_WARN_DOCUMENTATION_COMMENTS: NO
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    preBuildScripts:
      - name: Build Stockfish
        basedOnDependencyAnalysis: false
        script: |
          set -e
          ALLOW_STUB=1 /bin/bash "$SRCROOT/scripts/build-stockfish.sh"
    scheme:
      testTargets:
        - ChessEngineProTests
      gatherCoverageData: false

  ChessEngineProTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChessEngineProTests
    dependencies:
      - target: ChessEnginePro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chessenginepro.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ChessEnginePro.app/ChessEnginePro"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "5.9"
